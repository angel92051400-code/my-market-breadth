name: Validate market data pipeline

on:
  pull_request:
    paths:
      - main.py
      - market_cache.py
      - market_calendar.py
      - market_daily.py
      - tests/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r requirements.txt
          python -m compileall -q main.py market_cache.py market_calendar.py market_daily.py
          python -m unittest discover -s tests -p 'test_*.py' -v

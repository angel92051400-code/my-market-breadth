name: Daily Market Breadth Update

on:
  # One-shot verification whenever this workflow file is changed; no push loop.
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
  schedule:
    # Taipei 15:17; official TWSE calendar handles weekends and national holidays.
    - cron: '17 7 * * *'
    # Retry after Yahoo's Taiwan end-of-day quotes have had time to settle.
    - cron: '17 12 * * *'  # Taipei 20:17
    - cron: '17 15 * * *'  # Taipei 23:17
  workflow_dispatch:
    inputs:
      update_tickers:
        description: '手動更新市值前 640 大'
        type: boolean
        required: true
        default: false
      full_refresh:
        description: '完整校驗近兩年歷史報價（較慢）'
        type: boolean
        required: true
        default: false
      target_date:
        description: '指定補更新的交易日 YYYY-MM-DD（僅限近7天，留白使用目前日期）'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: market-breadth-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # No pip caching: TWSE holidays skip dependency installation,
          # so the post-job cache save would fail if ~/.cache/pip is absent.

      - name: Check TWSE trading calendar
        id: calendar
        env:
          MARKET_TARGET_DATE: ${{ inputs.target_date || '' }}
        run: python market_calendar.py

      - name: Install dependencies
        id: install
        if: steps.calendar.outputs.status != 'closed'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine update mode
        id: mode
        if: steps.calendar.outputs.status != 'closed'
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          TARGET_DAY: ${{ steps.calendar.outputs.date }}
          MANUAL_TICKERS: ${{ inputs.update_tickers }}
          MANUAL_FULL: ${{ inputs.full_refresh }}
        shell: bash
        run: |
          UPDATE_TICKERS=false
          FULL_REFRESH=false
          # Use intended market date, not the delayed runner start day.
          DOW=$(date -u -d "$TARGET_DAY" +%u)
          if [[ "$EVENT_NAME" == "schedule" && "$DOW" == "1" && "$SCHEDULE_CRON" == "17 7 * * *" ]]; then
            UPDATE_TICKERS=true
            FULL_REFRESH=true
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_TICKERS" == "true" ]]; then
            UPDATE_TICKERS=true
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_FULL" == "true" ]]; then
            FULL_REFRESH=true
          fi
          echo "tickers=$UPDATE_TICKERS" >> "$GITHUB_OUTPUT"
          echo "full=$FULL_REFRESH" >> "$GITHUB_OUTPUT"

      - name: Update Top 640 Stock List
        id: tickers
        if: steps.mode.outputs.tickers == 'true'
        continue-on-error: true
        run: python update_tickers.py

      - name: Validate Stock List
        id: validate
        if: steps.calendar.outputs.status != 'closed'
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          path = Path("tickers.csv")
          if not path.exists():
              raise RuntimeError("缺少 tickers.csv")
          df = pd.read_csv(path, dtype=str)
          if list(df.columns) != ["Symbol"] or len(df) != 640:
              raise RuntimeError("640 大清單數量或格式異常")
          x = df["Symbol"]
          if x.isna().any() or x.duplicated().any() or not x.str.fullmatch(r"\d{4}\.(TW|TWO)").all():
              raise RuntimeError("640 大股票代號無效")
          print("✅ 股票名單 640 檔驗證成功")
          PY

      - name: Generate Market Breadth Dashboard and quote cache
        id: dashboard
        if: steps.validate.outcome == 'success'
        env:
          MARKET_FULL_REFRESH: ${{ steps.mode.outputs.full }}
          EXPECT_TRADE_DATE: ${{ steps.calendar.outputs.date }}
        run: python main.py

      - name: Archive official daily breadth and constituent version
        id: archive
        if: steps.dashboard.outcome == 'success'
        env:
          EXPECT_TRADE_DATE: ${{ steps.calendar.outputs.date }}
        run: python market_daily.py

      - name: Commit dashboard and validated persistent market data
        id: publish
        if: steps.archive.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tickers.csv index.html data/stock_closes.csv.gz data/taiex_ohlc.csv.gz data/daily_breadth.csv data/constituents
          if git diff --cached --quiet; then
            echo "本日沒有新資料，無須提交"
          else
            git commit -m "Archive validated Taiwan market data and dashboard"
            git pull --rebase origin main
            git push
          fi

      - name: Upload quote quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-quote-diagnostics
          path: data/quote_diagnostics.json
          if-no-files-found: ignore

      - name: Persist latest run outcome for troubleshooting
        if: always()
        shell: bash
        env:
          CALENDAR: ${{ steps.calendar.outputs.status }}
          TARGET_DAY: ${{ steps.calendar.outputs.date }}
          VALIDATE: ${{ steps.validate.outcome }}
          DASHBOARD: ${{ steps.dashboard.outcome }}
          ARCHIVE: ${{ steps.archive.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          TICKERS: ${{ steps.tickers.outcome }}
          GITHUB_EVENT: ${{ github.event_name }}
          ACTIONS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          status = {
              "checked_at_utc": datetime.now(timezone.utc).isoformat(),
              "target_date": os.getenv("TARGET_DAY") or None,
              "event": os.getenv("GITHUB_EVENT"),
              "steps": {name: os.getenv(name) or "not_run" for name in
                        ("CALENDAR", "TICKERS", "VALIDATE", "DASHBOARD", "ARCHIVE", "PUBLISH")},
              "actions_run_url": os.getenv("ACTIONS_URL"),
          }
          path = Path("data/update_status.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(status, ensure_ascii=False))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/update_status.json
          git commit -m "Record last market update job outcome" || exit 0
          git pull --rebase origin main
          git push

      - name: Upload run diagnostic snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-run-status
          path: data/update_status.json
          if-no-files-found: ignore

      - name: Execution Summary
        if: always()
        env:
          CALENDAR: ${{ steps.calendar.outputs.status }}
          TICKERS: ${{ steps.tickers.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          DASHBOARD: ${{ steps.dashboard.outcome }}
          ARCHIVE: ${{ steps.archive.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        shell: bash
        run: |
          {
            echo "## 每日市場寬度工作流程"
            echo ""
            echo "| 項目 | 狀態 |"
            echo "|---|---|"
            echo "| TWSE 交易日 | $CALENDAR |"
            echo "| 更新 640 名單 | $TICKERS |"
            echo "| 名單驗證 | $VALIDATE |"
            echo "| 股價快取及圖表 | $DASHBOARD |"
            echo "| 每日正式紀錄 | $ARCHIVE |"
            echo "| GitHub 提交 | $PUBLISH |"
            echo ""
            if [[ "$CALENDAR" == "closed" ]]; then
              echo "✅ 官方休市：不下載、不新增、不改寫網站。"
            elif [[ "$DASHBOARD" == "success" && "$ARCHIVE" == "success" && "$PUBLISH" == "success" ]]; then
              echo "✅ 交易日報價、每日正式紀錄及網站已更新。"
            else
              echo "⚠️ 資料尚未符合發布條件，舊網站保留；請檢查上述步驟。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

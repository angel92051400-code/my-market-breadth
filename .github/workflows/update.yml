
name: Daily Market Breadth Update

on:
  schedule:
    # 台灣時間週一至週五 15:00
    - cron: '0 7 * * 1-5'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-breadth-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update Top 640 Stock List
        run: python update_tickers.py

      - name: Generate Market Breadth Dashboard
        run: python main.py

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tickers.csv index.html

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update stock list and market breadth"
            git push
          fi

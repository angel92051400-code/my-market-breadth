name: Daily Market Breadth Update

on:
  schedule:
    # 每天下午 3:00 執行 (台股收盤後)。注意：這裡是 UTC 時間，台灣時間 15:00 減去 8 小時為 07:00
    - cron: '0 7 * * 1-5' # 1-5 代表週一到週五
  workflow_dispatch: # 允許你隨時手動點擊按鈕測試執行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas plotly yfinance # 這裡補上你實際用到的套件

      - name: Run Python script
        run: python main.py

      - name: Commit and Push changes
        # 將更新後的資料和新產生的 index.html 推回 GitHub
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          # 如果你有儲存歷史紀錄的 csv 檔，也要加進來 e.g., git add history_data.csv
          git commit -m "Auto-update market breadth dashboard" || echo "No changes to commit"
          git push

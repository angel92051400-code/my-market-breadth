
name: Daily Market Breadth Update

on:
  schedule:
    # 週一：更新市值排名 + 圖表
    - cron: '0 7 * * 1'

    # 週二至週五：只更新圖表
    - cron: '0 7 * * 2-5'

  workflow_dispatch:
    inputs:
      update_tickers:
        description: '是否重新抓取市值前 640 大？'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: market-breadth-update
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ========================================
      # 1. 下載專案
      # ========================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      # ========================================
      # 2. Python 環境
      # ========================================

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ========================================
      # 3. 判斷是否需要更新市值排名
      # ========================================

      - name: Determine Update Mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_UPDATE: ${{ inputs.update_tickers }}
        run: |
          SHOULD_UPDATE=false

          if [[ "$EVENT_NAME" == "schedule" &&
                "$SCHEDULE" == "0 7 * * 1" ]]; then
            SHOULD_UPDATE=true
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" &&
                "$MANUAL_UPDATE" == "true" ]]; then
            SHOULD_UPDATE=true
          fi

          echo "update=$SHOULD_UPDATE" >> "$GITHUB_OUTPUT"
          echo "Update tickers: $SHOULD_UPDATE"

      # ========================================
      # 4. 每週更新市值前 640 大
      # ========================================

      - name: Update Top 640 Stock List
        id: tickers
        if: steps.mode.outputs.update == 'true'
        continue-on-error: true
        run: |
          python update_tickers.py

      # ========================================
      # 5. 驗證股票清單
      # ========================================

      - name: Validate Stock List
        id: validate
        env:
          UPDATE_REQUESTED: ${{ steps.mode.outputs.update }}
          TICKER_OUTCOME: ${{ steps.tickers.outcome }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd

          path = Path("tickers.csv")

          if not path.exists():
              raise RuntimeError(
                  "找不到 tickers.csv，無法更新圖表"
              )

          df = pd.read_csv(path)

          if list(df.columns) != ["Symbol"]:
              raise RuntimeError(
                  "tickers.csv 欄位必須只有 Symbol"
              )

          symbols = df["Symbol"].dropna().astype(str)

          if len(df) != 640 or len(symbols) != 640:
              raise RuntimeError(
                  f"股票清單數量異常：{len(df)}"
              )

          if symbols.duplicated().any():
              raise RuntimeError("股票代號重複")

          if not symbols.str.fullmatch(
              r"\d{4}\.(TW|TWO)"
          ).all():
              raise RuntimeError("股票代號格式錯誤")

          requested = os.environ["UPDATE_REQUESTED"]
          outcome = os.environ["TICKER_OUTCOME"]

          if requested == "true" and outcome == "failure":
              message = (
                  "⚠️ Yahoo 市值更新失敗，"
                  "使用原有 640 檔股票清單。"
              )
          elif requested == "true" and outcome == "success":
              message = (
                  "✅ 最新市值前 640 大清單通過驗證。"
              )
          else:
              message = (
                  "✅ 本日不重新排名，"
                  "沿用現有 640 檔股票清單。"
              )

          print(message)

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8"
          ) as f:
              f.write("## 股票清單使用狀態\n\n")
              f.write(message + "\n\n")
              f.write(f"有效股票數量：{len(symbols)}\n\n")
          PY

      # ========================================
      # 6. 每日更新市場寬度圖表
      # ========================================

      - name: Generate Market Breadth Dashboard
        id: dashboard
        run: |
          python main.py

      # ========================================
      # 7. GitHub 自動提交
      # ========================================

      - name: Commit and Push
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tickers.csv index.html

          if git diff --cached --quiet; then
            echo "沒有變更，不需要提交"
          else
            git commit -m "Auto-update market breadth"
            git push
          fi

      # ========================================
      # 8. 最後執行摘要
      # ========================================

      - name: Execution Summary
        if: always()
        env:
          MODE: ${{ steps.mode.outputs.update }}
          INSTALL: ${{ steps.install.outcome }}
          TICKERS: ${{ steps.tickers.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          DASHBOARD: ${{ steps.dashboard.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          {
            echo "## 📊 每日市場寬度執行報告"
            echo ""
            echo "| 項目 | 執行狀態 |"
            echo "|---|---|"
            echo "| 套件安裝 | $INSTALL |"
            echo "| 是否要求更新市值 | $MODE |"
            echo "| 市值前 640 大 | $TICKERS |"
            echo "| 股票名單驗證 | $VALIDATE |"
            echo "| 市場寬度圖表 | $DASHBOARD |"
            echo "| GitHub 提交 | $PUBLISH |"
            echo ""

            if [[ "$VALIDATE" == "success" &&
                  "$DASHBOARD" == "success" &&
                  "$PUBLISH" == "success" ]]; then

              if [[ "$TICKERS" == "failure" ]]; then
                echo "### ⚠️ 圖表成功，市值更新失敗"
                echo ""
                echo "使用原有 640 檔完成圖表更新。"

              elif [[ "$TICKERS" == "success" ]]; then
                echo "### ✅ 市值與圖表均更新成功"

              else
                echo "### ✅ 每日圖表更新完成"
                echo ""
                echo "本次未執行市值重新排名。"
              fi

            else
              echo "### ❌ 更新流程未完整完成"
              echo ""
              echo "請查看上方失敗步驟。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"


name: Daily Market Breadth Update

on:
  schedule:
    # 台灣時間週一至週五 15:00
    - cron: '0 7 * * 1-5'

  # 允許手動執行
  workflow_dispatch:

# 允許 Actions 更新 CSV 與網頁
permissions:
  contents: write

# 避免多次執行互相干擾
concurrency:
  group: market-breadth-update
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ==========================================
      # 1. 準備執行環境
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # 2. 更新股票市值前 640 大清單
      # ==========================================

      - name: Update Top 640 Stock List
        id: tickers
        run: |
          python update_tickers.py

      # ==========================================
      # 3. 更新市場寬度與布林通道
      # ==========================================

      - name: Generate Market Breadth Dashboard
        id: dashboard
        run: |
          python main.py

      # ==========================================
      # 4. 提交更新結果
      # ==========================================

      - name: Commit and Push changes
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tickers.csv index.html

          if git diff --cached --quiet; then
            echo "沒有資料變更，不需要提交"
          else
            git commit -m "Auto-update market breadth and Top 640"
            git push
          fi

      # ==========================================
      # 5. 自動產生 GitHub Actions 錯誤摘要
      # ==========================================

      - name: Generate Execution Summary
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          TICKERS: ${{ steps.tickers.outcome }}
          DASHBOARD: ${{ steps.dashboard.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        shell: bash
        run: |
          echo "## 📊 每日市場寬度更新報告" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 執行階段 | 狀態 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Python 套件安裝 | $INSTALL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 股票市值前 640 大 | $TICKERS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 市場寬度圖表 | $DASHBOARD |" >> "$GITHUB_STEP_SUMMARY"
          echo "| GitHub 自動提交 | $PUBLISH |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$INSTALL" == "failure" ]]; then
            echo "### ❌ 套件安裝失敗" >> "$GITHUB_STEP_SUMMARY"
            echo "請檢查 requirements.txt 與套件版本。" >> "$GITHUB_STEP_SUMMARY"

          elif [[ "$TICKERS" == "failure" ]]; then
            echo "### ❌ 股票名單更新失敗" >> "$GITHUB_STEP_SUMMARY"
            echo "詳細原因請查看上方 Python 診斷摘要。" >> "$GITHUB_STEP_SUMMARY"
            echo "本次不會執行圖表更新。" >> "$GITHUB_STEP_SUMMARY"

          elif [[ "$DASHBOARD" == "failure" ]]; then
            echo "### ❌ 市場寬度圖表產生失敗" >> "$GITHUB_STEP_SUMMARY"
            echo "請檢查 main.py 與 Yahoo Finance 報價下載。" >> "$GITHUB_STEP_SUMMARY"
            echo "本次不會推送新檔案。" >> "$GITHUB_STEP_SUMMARY"

          elif [[ "$PUBLISH" == "failure" ]]; then
            echo "### ❌ GitHub 提交失敗" >> "$GITHUB_STEP_SUMMARY"
            echo "請檢查 Actions 寫入權限、分支保護及推送衝突。" >> "$GITHUB_STEP_SUMMARY"

          elif [[ "$INSTALL" == "success" &&
                  "$TICKERS" == "success" &&
                  "$DASHBOARD" == "success" &&
                  "$PUBLISH" == "success" ]]; then
            echo "### ✅ 全部更新完成" >> "$GITHUB_STEP_SUMMARY"
            echo "股票清單與市場寬度圖表已完成處理。" >> "$GITHUB_STEP_SUMMARY"

          else
            echo "### ⚠️ 工作流程未完整執行" >> "$GITHUB_STEP_SUMMARY"
            echo "請檢查上方各步驟狀態。" >> "$GITHUB_STEP_SUMMARY"
          fi
